<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
  <!-- Signature Mark -->
  <symbol id="icon-signature-mark" viewBox="0 0 20 20">
    <rect x="3" y="8" width="14" height="4" rx="2" transform="rotate(-45 10 10)" fill="currentColor" />
  </symbol>

  <!-- ContextHop Logo -->
  <symbol id="icon-signature-logo" viewBox="0 0 128 128">
    <rect width="128" height="128" rx="28" fill="#0B1220"/>
    <path d="M 48 58 C 50 22 72 32 80 52 M 83.2 43.6 L 80 52 L 72.4 47" fill="none" stroke="#FFC83D" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 42 64.5 C 51.4 64.5 59 70.5 59 78 C 59 85.5 51.4 91.5 42 91.5 C 39.5 91.5 37.2 91.1 35 90.4 L 27 96 L 29.5 87.6 C 26.9 85.2 25 81.8 25 78 C 25 70.5 32.6 64.5 42 64.5 Z" fill="none" stroke="#E8EDF7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 86 60 C 97 60 106 67 106 76 C 106 81 103.8 85.5 100.2 88.7 L 104 98 L 94.5 91.4 C 92.4 91.8 89.2 92 86 92 C 75 92 66 85 66 76 C 66 67 75 60 86 60 Z" fill="#FFC83D" stroke="#FFC83D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- Copy Icon -->
  <symbol id="icon-copy" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="7" y="7" width="9.5" height="9.5" rx="2" />
    <path d="M4 13V4.5A1.5 1.5 0 0 1 5.5 3H14" />
  </symbol>

  <!-- Checkmark -->
  <symbol id="icon-check" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="4 10.5 8 14.5 16 6" />
  </symbol>

  <!-- Download / Export -->
  <symbol id="icon-download" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3.5 13.5v2a1.5 1.5 0 0 0 1.5 1.5h10a1.5 1.5 0 0 0 1.5-1.5v-2" />
    <polyline points="6.5 9.5 10 13 13.5 9.5" />
    <line x1="10" y1="3" x2="10" y2="13" />
  </symbol>

  <!-- Upload / Import -->
  <symbol id="icon-upload" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3.5 13.5v2a1.5 1.5 0 0 0 1.5 1.5h10a1.5 1.5 0 0 0 1.5-1.5v-2" />
    <polyline points="6.5 6.5 10 3 13.5 6.5" />
    <line x1="10" y1="13" x2="10" y2="3" />
  </symbol>

  <!-- Trash / Delete -->
  <symbol id="icon-trash" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="3.5 5.5 5 5.5 16.5 5.5" />
    <path d="M6.5 5.5V4a1.5 1.5 0 0 1 1.5-1.5h4a1.5 1.5 0 0 1 1.5 1.5v1.5" />
    <path d="M15 5.5v10a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-10" />
    <line x1="8.5" y1="9" x2="8.5" y2="14" />
    <line x1="11.5" y1="9" x2="11.5" y2="14" />
  </symbol>

  <!-- Settings / Gear -->
  <symbol id="icon-settings" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10" cy="10" r="2.8" />
    <path d="M16.2 12.4a1.2 1.2 0 0 0 .25 1.34l.05.05a1.44 1.44 0 0 1-2.04 2.04l-.05-.05a1.2 1.2 0 0 0-1.34-.25 1.2 1.2 0 0 0-.72 1.1v.12a1.44 1.44 0 0 1-2.88 0v-.12a1.2 1.2 0 0 0-.72-1.1 1.2 1.2 0 0 0-1.34.25l-.05.05a1.44 1.44 0 0 1-2.04-2.04l.05-.05a1.2 1.2 0 0 0 .25-1.34 1.2 1.2 0 0 0-1.1-.72h-.12a1.44 1.44 0 0 1 0-2.88h.12a1.2 1.2 0 0 0 1.1-.72 1.2 1.2 0 0 0-.25-1.34l-.05-.05a1.44 1.44 0 0 1 2.04-2.04l.05.05a1.2 1.2 0 0 0 1.34.25 1.2 1.2 0 0 0 .72-1.1V3.8a1.44 1.44 0 0 1 2.88 0v.12a1.2 1.2 0 0 0 .72 1.1 1.2 1.2 0 0 0 1.34-.25l.05-.05a1.44 1.44 0 0 1 2.04 2.04l-.05.05a1.2 1.2 0 0 0-.25 1.34 1.2 1.2 0 0 0 1.1.72h.12a1.44 1.44 0 0 1 0 2.88h-.12a1.2 1.2 0 0 0-1.1.72z" />
  </symbol>

  <!-- External Link -->
  <symbol id="icon-external" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M15 10.5v5a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 3 15.5v-9A1.5 1.5 0 0 1 4.5 5H9.5" />
    <polyline points="12 3 17 3 17 8" />
    <line x1="8.5" y1="11.5" x2="16.5" y2="3.5" />
  </symbol>

  <!-- Search -->
  <symbol id="icon-search" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="9" cy="9" r="5.5" />
    <line x1="13.5" y1="13.5" x2="17" y2="17" />
  </symbol>

  <!-- Pencil / Rename -->
  <symbol id="icon-pencil" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13.5 4.5l2 2-9 9H4.5v-2l9-9z" />
    <line x1="12" y1="6" x2="14" y2="8" />
  </symbol>

  <!-- Menu / Overflow (3 dots) -->
  <symbol id="icon-menu" viewBox="0 0 20 20" fill="currentColor">
    <circle cx="10" cy="5" r="1.3" />
    <circle cx="10" cy="10" r="1.3" />
    <circle cx="10" cy="15" r="1.3" />
  </symbol>

  <!-- Close / X -->
  <symbol id="icon-close" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="5" y1="5" x2="15" y2="15" />
    <line x1="15" y1="5" x2="5" y2="15" />
  </symbol>

  <!-- Clean up / Broom -->
  <symbol id="icon-broom" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M15.5 3.5l-6 6" />
    <path d="M9.5 9.5l-4 4a2 2 0 0 0 0 2.8l.2.2a2 2 0 0 0 2.8 0l4-4" />
    <line x1="6.5" y1="14.5" x2="10.5" y2="10.5" />
  </symbol>

  <!-- Chevron Down -->
  <symbol id="icon-chevron-down" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="6 8 10 12 14 8" />
  </symbol>

  <!-- Chevron Right -->
  <symbol id="icon-chevron-right" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="8 6 12 10 8 14" />
  </symbol>

  <!-- Chevron Left -->
  <symbol id="icon-chevron-left" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="12 6 8 10 12 14" />
  </symbol>

  <!-- Sun (Light) -->
  <symbol id="icon-sun" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10" cy="10" r="3.5" />
    <line x1="10" y1="2.5" x2="10" y2="4.5" />
    <line x1="10" y1="15.5" x2="10" y2="17.5" />
    <line x1="2.5" y1="10" x2="4.5" y2="10" />
    <line x1="15.5" y1="10" x2="17.5" y2="10" />
    <line x1="4.7" y1="4.7" x2="6.1" y2="6.1" />
    <line x1="13.9" y1="13.9" x2="15.3" y2="15.3" />
    <line x1="4.7" y1="15.3" x2="6.1" y2="13.9" />
    <line x1="13.9" y1="6.1" x2="15.3" y2="4.7" />
  </symbol>

  <!-- Moon (Dark) -->
  <symbol id="icon-moon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M16.5 11.5A7 7 0 1 1 8.5 3.5a5.5 5.5 0 0 0 8 8z" />
  </symbol>

  <!-- Display / Auto -->
  <symbol id="icon-display" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="4" width="14" height="9.5" rx="1.5" />
    <line x1="7.5" y1="16.5" x2="12.5" y2="16.5" />
    <line x1="10" y1="13.5" x2="10" y2="16.5" />
  </symbol>

  <!-- Code symbol -->
  <symbol id="icon-code" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="13.5 6.5 17 10 13.5 13.5" />
    <polyline points="6.5 6.5 3 10 6.5 13.5" />
  </symbol>

  <!-- Message Bubble -->
  <symbol id="icon-chat" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 14.5V5.5A1.5 1.5 0 0 1 5.5 4h9A1.5 1.5 0 0 1 16 5.5v7a1.5 1.5 0 0 1-1.5 1.5H7.5L4 16.5v-2z" />
  </symbol>

  <!-- Warning / Danger Triangle -->
  <symbol id="icon-alert" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9.13 3.5a1 1 0 0 1 1.74 0l6.5 11.25A1 1 0 0 1 16.5 16.25H3.5a1 1 0 0 1-.87-1.5L9.13 3.5z" />
    <line x1="10" y1="8" x2="10" y2="11.5" />
    <circle cx="10" cy="14" r=".6" fill="currentColor" />
  </symbol>

  <!-- Info Circle -->
  <symbol id="icon-info" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10" cy="10" r="7.5" />
    <line x1="10" y1="9" x2="10" y2="14" />
    <circle cx="10" cy="6.25" r="0.8" fill="currentColor" stroke="none" />
  </symbol>

  <!-- Refresh / Reload -->
  <symbol id="icon-refresh" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M16 8.5A6.5 6.5 0 1 0 16.5 10" />
    <polyline points="16 4.5 16 8.5 12 8.5" />
  </symbol>
</svg>
